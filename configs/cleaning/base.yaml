# General
name : 'base_20260310'
comment : 'Base cleaning parameters for the preciptiation dataset (Default)'
input_data : 'merged_data.csv'

# Cleaning
precipitation:
  max_value : 400 # <=
  min_value : 0   # >=
times : ["00", "50", "40", "30", "20", "10"]
channels : ["07", "08", "13"]
flag:
  include : ['C0000002', 'M0000002']
  exclude : []

flag_v2:
  include : ['D01','D02'] # ,'C01'
  exclude : []

# Target 
target:
  name : 'TARGET'
  col : 'FLAG'
  good_class : 'C0000002'

# Split
zeros : 0.1
splits:
  train : 0.8
  test : 0.1
  holdout : 0.1


# ============================================================
# Base configuration (shared across tasks/experiments)
# Project: ML with Satellite Images GOES and precipitation data
# Author: Diego Paredes
# ============================================================

project:
  name: "ml-satellite-images-goes-precipitation"
  version: "0.1.0"
  description: "Deep learning pipelines for satellite images GOES-16 and precipitation data"

# ------------------------------------------------------------------
# Reproducibility
# ------------------------------------------------------------------
seed: 42
deterministic: true  # set false for faster training if needed

# ------------------------------------------------------------------
# Paths (use relative paths from repo root)
# ------------------------------------------------------------------
paths:
  data:
    raw: "data/raw"
    interim: "data/interim"
    processed: "data/processed"
    stations : "data/raw/stations/"
    thresholds : "data/raw/thresholds/"
  goes:
    images: "data/goes_images/"        # carpeta final (raw/curated)
    test: "data/goes_images/test/" # carpeta con imagenes de prueba (solo para testeo)
  outputs:
    root: "outputs"
    experiments: "outputs/experiments"      # optional: unified experiments directory
    figures: "outputs/figures"
    metrics: "outputs/metrics"
    models: "outputs/models"
    logs: "outputs/logs"

# ------------------------------------------------------------------
# GOES
# ------------------------------------------------------------------
goes:
  start : "2023-11-21-01-00"
  end : "2023-11-21-03-00" #"2025-11-21-01-00"

  time_offset_hours : 5
  save_images: true
  goes_data: "data/goes_images/" 
  goes_test_images : "data/goes_images/test/"
  
  limits:
    min_image_size_bytes: 26214400     # 25 * 1024 * 1024
    max_temp_folder_bytes: 1006632960  # 2 * (480 * 1024 * 1024)

    max_image_folder_bytes: -1 #-1 no se borra nada, 402653184  # 12 * (32 * 1024 * 1024) aprox

  domain: [-88.0, -63.0, -25.0, 5.0]  # [lon_min, lon_max, lat_min, lat_max]
  times : ["00", "50", "40", "30", "20", "10"]
  channels : ["07", "08", "13"]


  reprojection:
    pixres_km: 2.0
    xmin: 80
    xmax: 1030
    ymin: 700
    ymax: 1900
    radius: 6000

  save_images : True

# ------------------------------------------------------------------
# Evaluation & artifacts
# ------------------------------------------------------------------
evaluation:
  save_predictions: true
  save_figures: true
  top_k_examples: 24         # for qualitative analysis visuals
  metrics:
    classification: ["auc", "f1", "precision", "recall"]
    regression: ["rmse", "mae", "r2"]

# ------------------------------------------------------------------
# Logging & experiment tracking
# ------------------------------------------------------------------
logging:
  level: "DEBUG"
  log_to_file: true

tracking:
  use_wandb: true
  wandb:
    project: "satprecip"
    entity: null             # set your username/team or leave null
    tags: ["goes16", "peru", "deep-learning"]
    mode: "online"           # ["online", "offline", "disabled"]

# ------------------------------------------------------------------
# Runtime / device
# ------------------------------------------------------------------
runtime:
  framework: "tensorflow"
  device: "auto"             # ["auto", "cpu", "gpu"]